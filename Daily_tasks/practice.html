<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
  margin: 0;
}

.hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
  background: #111;
}

/* Text */
.text {
  position: relative;
  z-index: 2;
  color: white;
  text-align: center;
  top: 40%;
  font-size: 50px;
}

/* Falling images */
.fall {
  position: absolute;
  top: -100px;
  width: 80px;
  animation:alternate 5s linear ;
  opacity: 0.8;
}

/* Different positions + delays */
.img1 {
  left: 20%;
  animation-delay: 0s;
}

.img2 {
  left: 50%;
  animation-delay: 2s;
}

.img3 {
  left: 80%;
  animation-delay: 4s;
}

/* Animation */
@keyframes fall {
  0% {
    transform: translateY(0);
  }
  100% {
    transform: translateY(110vh);
  }
}
  </style>
</head>
<body>
  <div class="hero">
  <h1 class="text">Chocolate World</h1>

  <!-- falling images -->
  <img src="assets/download.jpg" class="fall img1">
  <img src="assets/dp.jpg" class="fall img2">
  <img src="assets/home-1-phone-11.png" class="fall img3">
</div>
</body>
</html>
