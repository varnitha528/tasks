<body>

<h1 id="main-heading">Welcome to DOM Practice</h1>

<div id="container">

     <p class="info">This is paragraph 2 with class info</p>

</div>

<ul id="fruit-list">
    <li>Apple</li>
    <li>Banana</li>
    <li>Orange</li>

    <li>Cherry</li>
</ul>

<div id="buttons">
<button class="btn primary">Button 1</button>
<button class="btn secondary">Button 2</button>
<button class="btn primary">Button 3</button>
</div>

<input type="text" id="username" placeholder="Enter Password..">
<input type="text" id="email" placeholder="Enter Email..">
    
</body>

<script>
    //1.textContent (pure text manipulation )
  const heading = document.querySelector("#main-heading");
  console.log(heading.textContent);
  heading.textContent = "Welcome to Document Object Model-DOM Practice";
  console.log(heading.textContent);
    //innnerHTML (can use tags to render ,css)(not safe)
heading.innerHTML ="<em>Welcome to Document Object Model <br>-DOM Practice</em>";

  //heading.innerText ="<em>Welcome to Document Object Model <br>-DOM Practice</em>";
  
  
 // changing styles

</script>
