<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
        }
        .box{
            width: 500px;
            background-color: #eee;
            font-family: sans-serif;
            border-radius: 10px;
            box-shadow: 0 0px 30px rgb(189, 189, 189);
            padding: 20px;
            margin: 100px;
        }
        h2{
            padding: 10px 10px;
        }
        #addBtn, #back{
            padding: 10px 15px;
            font-size: 17px;
            background-color: rgb(105, 179, 105);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 30px;
        }
        #addBtn:hover{
            background-color:  rgb(103, 193, 103);
        }
        input{
        
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px;
            border-radius: 4px;
        }
        input:focus{
            outline: none;
        }
        ul{
            list-style-type: none;
            padding: 10px;
        }
        #deleteBtn{
             padding: 5px 15px;
            font-size: 17px;
            background-color:rgb(214, 97, 97);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 0px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Todo List</h2>
        <input id="taskInput" type="text" placeholder="Enter a task..">
        <button id="addBtn">Add</button>
        <ul id="taskList"></ul>
    </div>
    <button id="back">Change color</button>
    <script>
    const input = document.getElementById("taskInput");
const addBtn = document.getElementById("addBtn");
const taskList = document.getElementById("taskList");

let tasks = [];

function displayTasks() {

    taskList.innerHTML = "";

    tasks.forEach(function(task) {

        const li = document.createElement("li");

        li.innerHTML = `<input type="checkbox">
            ${task}
            <button id="deleteBtn" onclick="deleteTask('${task}')">Delete</button>
        `;

        taskList.prepend(li);
    });

}

addBtn.addEventListener("click", function () {

    const task = input.value.trim();

    if (task === "") {
        alert("Enter a task");
        return;
    }

    tasks.push(task);

    input.value = "";

    displayTasks();

});

function deleteTask(task) {

    const index = tasks.findIndex(function(item) {
        return item === task;
    });

    if (index !== -1) {
        tasks.splice(index, 1);
    }

    displayTasks();
}



// change background color 
const back = document.getElementById("back");
const colors = ["#B0BA99","#FF97D0", "#95CCDD" ,"#E05454","#FFAE56","#5E244E"];
back.addEventListener("click",() =>{
    const random = Math.floor(Math.random()* colors.length);
    document.body.style.backgroundColor = colors[random];
});
    </script>
</body>
</html>
