<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <script>


    var arr = [12, 34, 23, 53, 32, 16];
    document.write(arr + " original <br>");
    arr.sort();
    document.write(arr + " Sort <br>");
    arr.reverse();
    document.write(arr + " reverse <br>");
    arr.push(99);
    document.write(arr + " add value at end <br>");
    arr.pop(99);
    document.write(arr + " removes value at end<br>");
    arr.shift();
    document.write(arr + " removes value at start<br>");
    arr.unshift(99);
    document.write(arr + " adds value at start<br>");

    var a = ["ravi", "raju", "kumar", "rahul"];
    // var b = a.concat(12, 23, 21, 20); 
    // document.write(b + " concadination");
    var b = [12, 23, 21, 20];
    var c = a.concat(b);
    document.write(c + " concadination");








  </script>
</body>

</html>
