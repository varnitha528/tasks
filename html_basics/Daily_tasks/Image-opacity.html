<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image-opacity</title>
<style>
  body{
    background-color: black;
  }
.text{
       position: relative;
      color: white;
      font-size: 40px;
      font-weight: bold;
      text-align: center;
      padding: 150px;
      overflow: hidden;
      
}
  .text::before{
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url("https://etimg.etb2bimg.com/photo/121373442.cms") no-repeat center/cover;
      opacity: 0.5; 
      z-index: -1;
  }

</style>

</head>
<body>
  
    <div class="text">
   Horizon university
  </div>


</body>
</html>
